<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAMS 学校教务管理系统 - 忘记密码</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
    <div class="card">
        <div class="brand">
            <div class="logo">E</div>
            <h1>忘记密码</h1>
            <p>重置你的 EAMS 账号密码</p>
        </div>
        <div id="msg" class="msg"></div>

        <div class="field">
            <input type="text" id="username" placeholder="请输入你的用户名" autocomplete="username">
        </div>

        <div class="field">
            <input type="password" id="newPassword" placeholder="新密码（8-30位，含大小写字母+数字+特殊字符）"
                   oninput="updateStrength()" autocomplete="new-password">
        </div>
        <!-- 密码强度指示条 -->
        <div class="pwd-strength-wrap">
            <div class="pwd-strength-bar" id="strengthBar">
                <div class="seg"></div><div class="seg"></div>
                <div class="seg"></div><div class="seg"></div>
                <div class="seg"></div>
            </div>
            <div class="pwd-strength-text" id="strengthText"></div>
            <div class="pwd-rules" id="strengthRules"></div>
        </div>

        <div class="field">
            <input type="password" id="confirmPassword" placeholder="确认新密码" autocomplete="new-password"
                   oninput="updateConfirm()">
        </div>
        <div class="field hint" id="confirmHint"></div>

        <button class="btn" id="resetBtn" onclick="resetPassword()" disabled>确认重置</button>
        <button class="btn" style="background:#999; margin-top:8px;" onclick="cancelReset()">取消</button>

        <div class="tip"><a href="/static/login.html">返回登录</a></div>
    </div>

    <script src="/static/js/forgot-password.js"></script>
</body>
</html>
